<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicao} ? 'Editar Produto' : 'Novo Produto')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

  <header th:replace="~{fragments/layout :: navbar}"></header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Breadcrumb / Voltar -->
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/produtos}" class="text-decoration-none">Produtos</a></li>
            <li class="breadcrumb-item active" th:text="${modoEdicao} ? 'Editar Produto #' + ${produtoDto.id} : 'Novo Cadastro'">Ação</li>
          </ol>
        </nav>

        <div class="card border-0 shadow-sm bg-white p-4 p-md-5">
          <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
            <div class="bg-primary text-white p-3 rounded-circle">
              <i class="bi" th:classappend="${modoEdicao} ? 'bi-pencil-square fs-3' : 'bi-plus-circle fs-3'"></i>
            </div>
            <div>
              <h3 class="fw-bold mb-0 text-dark" th:text="${modoEdicao} ? 'Editar Produto' : 'Cadastrar Novo Produto'">Título</h3>
              <p class="text-muted small mb-0">Preencha os campos abaixo com as informações do item do mercado</p>
            </div>
          </div>

          <!-- Formulário Spring MVC com Thymeleaf e Bean Validation -->
          <form th:action="@{/produtos/salvar}" th:object="${produtoDto}" method="post" novalidate>
            
            <!-- Hidden Fields para Edição -->
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{dataCadastro}" />

            <!-- Nome do Produto -->
            <div class="mb-3">
              <label for="nome" class="form-label fw-semibold">Nome do Produto <span class="text-danger">*</span></label>
              <input type="text"
                     class="form-control"
                     id="nome"
                     th:field="*{nome}"
                     placeholder="Ex: Sabão Líquido Omo 3L, Maçã Fuji, Kit de Meias..."
                     th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                Erro no nome
              </div>
            </div>

            <div class="row g-3 mb-3">
              <!-- Categoria -->
              <div class="col-md-6">
                <label for="categoria" class="form-label fw-semibold">Categoria <span class="text-danger">*</span></label>
                <select id="categoria"
                        class="form-select"
                        th:field="*{categoria}"
                        th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid' : ''">
                  <option value="">-- Selecione uma Categoria --</option>
                  <option th:each="cat : ${categorias}"
                          th:value="${cat}"
                          th:text="${cat.descricao}">Categoria</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}">
                  Erro na categoria
                </div>
              </div>

              <!-- Código de Barras (EAN-13) -->
              <div class="col-md-6">
                <label for="codigoBarras" class="form-label fw-semibold">Código de Barras (EAN-13)</label>
                <input type="text"
                       class="form-control"
                       id="codigoBarras"
                       th:field="*{codigoBarras}"
                       placeholder="Ex: 7891038000111"
                       th:classappend="${#fields.hasErrors('codigoBarras')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('codigoBarras')}" th:errors="*{codigoBarras}">
                  Erro no código de barras
                </div>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <!-- Preço Unitário -->
              <div class="col-md-6">
                <label for="preco" class="form-label fw-semibold">Preço Unitário (R$) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text">R$</span>
                  <input type="number"
                         step="0.01"
                         class="form-control"
                         id="preco"
                         th:field="*{preco}"
                         placeholder="0.00"
                         th:classappend="${#fields.hasErrors('preco')} ? 'is-invalid' : ''">
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">
                  Erro no preço
                </div>
              </div>

              <!-- Quantidade em Estoque -->
              <div class="col-md-6">
                <label for="estoque" class="form-label fw-semibold">Quantidade em Estoque <span class="text-danger">*</span></label>
                <input type="number"
                       class="form-control"
                       id="estoque"
                       th:field="*{estoque}"
                       placeholder="0"
                       th:classappend="${#fields.hasErrors('estoque')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}">
                  Erro no estoque
                </div>
              </div>
            </div>

            <!-- Descrição Detalhada -->
            <div class="mb-4">
              <label for="descricao" class="form-label fw-semibold">Descrição do Produto</label>
              <textarea class="form-control"
                        id="descricao"
                        rows="3"
                        th:field="*{descricao}"
                        placeholder="Informe detalhes, especificações, peso ou observações sobre o item..."
                        th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid' : ''"></textarea>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">
                Erro na descrição
              </div>
            </div>

            <!-- Botões de Ação -->
            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
              <a th:href="@{/produtos}" class="btn btn-outline-secondary px-4 rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm fw-semibold">
                <i class="bi bi-check2-circle me-1"></i> Salvar Produto
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
