<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' — Mercado Express'">Mercado Express</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <!-- Navbar Fragment -->
  <header th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/}">
          <i class="bi bi-cart4 text-warning"></i>
          <span>Mercado<span class="text-white">Express</span></span>
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle ms-2 fs-6">MVC</span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/dashboard}">
                <i class="bi bi-speedometer2"></i> Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/produtos}">
                <i class="bi bi-boxes"></i> Catálogo de Produtos
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/produtos/novo}">
                <i class="bi bi-plus-circle-fill text-success"></i> Novo Produto
              </a>
            </li>
          </ul>

          <!-- User Profile & Logout -->
          <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
            <div class="text-end d-none d-sm-block">
              <small class="text-secondary d-block">Logado como:</small>
              <span class="fw-semibold text-light" sec:authentication="name">Usuário</span>
              <span class="badge bg-secondary ms-1" sec:authorize="hasRole('ADMIN')">ADMIN</span>
              <span class="badge bg-secondary ms-1" sec:authorize="!hasRole('ADMIN')">OPERADOR</span>
            </div>
            
            <form th:action="@{/logout}" method="post" class="m-0">
              <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                <i class="bi bi-box-arrow-right"></i> Sair
              </button>
            </form>
          </div>

          <!-- Login Link (when anonymous) -->
          <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}" class="btn btn-primary btn-sm rounded-pill px-4">
              <i class="bi bi-lock-fill"></i> Entrar
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Footer Fragment -->
  <footer th:fragment="footer" class="mt-auto">
    <div class="container text-center">
      <p class="mb-1 fw-semibold text-white">FIAP — Checkpoint 4 (Parte 2: Spring Web MVC & Security)</p>
      <small class="text-muted">Desenvolvido pela Equipe Mercado Express • RM562795</small>
    </div>
  </footer>

  <!-- Scripts Fragment -->
  <div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </div>

</body>
</html>
