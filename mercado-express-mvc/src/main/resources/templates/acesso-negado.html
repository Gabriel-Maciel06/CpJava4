<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acesso Negado')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

  <header th:replace="~{fragments/layout :: navbar}"></header>

  <main class="container d-flex align-items-center justify-content-center py-5">
    <div class="card p-4 p-md-5 text-center border-0 shadow-sm bg-white" style="max-width: 540px;">
      <div class="bg-danger text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 mx-auto" style="width: 72px; height: 72px;">
        <i class="bi bi-shield-x fs-1"></i>
      </div>
      <h2 class="fw-bold text-danger mb-2" th:text="${titulo}">403 — Acesso Negado</h2>
      <p class="text-muted" th:text="${mensagem}">
        Você não possui privilégios suficientes para executar esta operação.
      </p>

      <div class="p-3 bg-light rounded-3 text-start small border mb-4">
        <strong><i class="bi bi-info-circle-fill text-primary"></i> Regra de Segurança:</strong>
        <p class="mb-0 text-muted mt-1">A operação de exclusão física de registros exige o perfil <code>ROLE_ADMIN</code>. O seu usuário atual está autenticado com permissões restritas (<code>ROLE_USER</code>).</p>
      </div>

      <a th:href="@{/produtos}" class="btn btn-primary px-4 rounded-pill">
        <i class="bi bi-arrow-left me-1"></i> Retornar ao Catálogo
      </a>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
