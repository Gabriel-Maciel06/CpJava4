# ===================================================================
# Configurações do Spring Boot - Mercado Express MVC (Parte 2)
# ===================================================================
spring.application.name=mercado-express-mvc
server.port=${PORT:8090}

# ===================================================================
# Banco de Dados (Padrão: H2 In-Memory com Modo Oracle)
# Permite rodar instantaneamente sem depender de VPN/Firewall da FIAP
# ===================================================================
spring.datasource.url=jdbc:h2:mem:mercadodb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Hibernate & JPA
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# Logs de Segurança
# ===================================================================
logging.level.org.springframework.security=INFO
