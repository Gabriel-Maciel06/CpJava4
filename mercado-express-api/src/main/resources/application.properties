# ===================================================================
# Mercado Express API - Checkpoint 4 (FIAP)
# Server Configuration (Porta 8082 obrigatoria conforme especificação)
# ===================================================================
server.port=8082
server.servlet.context-path=/

# Nome da Aplicação
spring.application.name=mercado-express-api

# ===================================================================
# Database Configuration (Oracle FIAP + Fallback H2 In-Memory)
# ===================================================================
# Para conectar ao Oracle da FIAP, configure as variaveis de ambiente ou utilize os defaults abaixo:
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:mercadodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Disponível em http://localhost:8082/h2-console para testes locais)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI / Swagger UI (http://localhost:8082/swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Jackson JSON Configuration
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null
